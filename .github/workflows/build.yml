name: Build FocusMode.dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dylibs (arm64, iOS 15+)
        continue-on-error: true
        run: |
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          : > build/build.log
          for n in HTFix HTAds HTDict HTSave HTTranslate HTOnline; do
            echo "== $n ==" | tee -a build/build.log
            (xcrun --sdk iphoneos clang \
              -arch arm64 -miphoneos-version-min=15.0 -isysroot "$SDK" \
              -fobjc-arc -dynamiclib -Os -Wall -Wno-deprecated-declarations \
              -framework UIKit -framework Foundation -framework Security -framework QuartzCore -framework CoreGraphics -framework Photos -framework AVFoundation -framework UserNotifications \
              -install_name @executable_path/Frameworks/$n.dylib \
              -o build/$n.dylib src/$n.m && codesign -f -s - build/$n.dylib && echo "OK $n") 2>&1 | tee -a build/build.log
          done
          echo "== FocusMode (all-in-one) ==" | tee -a build/build.log
          (mkdir -p build/obj && for n in HTFix HTAds HTDict HTSave HTTranslate HTOnline; do
             xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -isysroot "$SDK" -fobjc-arc -Os -Wall -Wno-deprecated-declarations -DRA_NO_IMPL -c src/$n.m -o build/obj/$n.o || exit 1
           done
           xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -isysroot "$SDK" -fobjc-arc -Os -Wno-deprecated-declarations -c src/ra_impl.m -o build/obj/ra_impl.o || exit 1
           xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -isysroot "$SDK" -dynamiclib build/obj/*.o \
             -framework UIKit -framework Foundation -framework Security -framework QuartzCore -framework CoreGraphics -framework Photos -framework AVFoundation -framework UserNotifications \
             -install_name @executable_path/Frameworks/FocusMode.dylib -o build/FocusMode.dylib && codesign -f -s - build/FocusMode.dylib && echo "OK FocusMode") 2>&1 | tee -a build/build.log
          ls -la build | tee -a build/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: dylibs
          path: build/*.dylib
          if-no-files-found: ignore

      - name: Commit built dylib + log to dist/
        if: always()
        run: |
          mkdir -p dist
          cp build/build.log dist/build.log || true
          rm -f dist/*.dylib; cp build/*.dylib dist/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "build: dylibs [skip ci]"
          git push
