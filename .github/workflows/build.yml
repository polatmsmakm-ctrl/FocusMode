name: Build FocusMode.dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build arm64 dylib for iOS
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
                -dynamiclib \
                -isysroot "$SDK" \
                -miphoneos-version-min=15.0 \
                -framework UIKit \
                -framework Foundation \
                -install_name "@executable_path/Frameworks/FocusMode.dylib" \
                -o FocusMode.dylib \
                FocusMode.m

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FocusMode.dylib
          path: FocusMode.dylib
